<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Our Little Space ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@400;500&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="menu.css">
</head>

<body>

  <div class="menu-glow glow-one"></div>
  <div class="menu-glow glow-two"></div>
  <div class="grain"></div>

  <main class="menu-page">

    <header class="menu-header">

      <button
        class="back-button"
        id="backButton"
        type="button"
        aria-label="กลับ"
      >
        ←
      </button>

      <div class="menu-title">
        <span>our little space</span>

        <h1>เลือกดูสิ ♡</h1>

        <p>มีอะไรเล็ก ๆ ที่อยากให้เธอดู</p>
      </div>

      <span class="menu-heart">♡</span>

    </header>


    <section class="menu-grid">

      <!-- MEMORY -->
      <a href="memory.html" class="menu-card memory-card">

        <div class="card-image">

          <div class="photo-shape photo-one"></div>
          <div class="photo-shape photo-two"></div>

          <span class="image-number">01</span>
          <span class="image-symbol">♡</span>

        </div>

        <div class="card-info">

          <div>
            <strong>memories</strong>
            <small>เรื่องราวของเรา</small>
          </div>

          <span>→</span>

        </div>

      </a>


      <!-- LETTER -->
      <a href="letter.html" class="menu-card letter-card">

        <div class="card-image">

          <div class="paper">

            <span>FOR YOU</span>

            <i>♡</i>

            <div class="paper-lines"></div>

          </div>

        </div>

        <div class="card-info">

          <div>
            <strong>letter</strong>
            <small>มีอะไรอยากบอก</small>
          </div>

          <span>→</span>

        </div>

      </a>


      <!-- TIMELINE -->
      <a href="timeline.html" class="menu-card timeline-card">

        <div class="card-image">

          <div class="film">
            <span>12</span>
            <b>10</b>
            <em>25</em>
          </div>

        </div>

        <div class="card-info">

          <div>
            <strong>timeline</strong>
            <small>ตั้งแต่วันแรกของเรา</small>
          </div>

          <span>→</span>

        </div>

      </a>


      <!-- GAME -->
      <a href="game.html" class="menu-card game-card">

        <div class="card-image">

          <div class="game-preview">

            <div class="game-stars">
              ✦　·　✦
            </div>

            <div class="game-icon">
              ♡
            </div>

            <div class="game-play">
              PLAY GAME
              <span>→</span>
            </div>

          </div>

        </div>

        <div class="card-info">

          <div>
            <strong>our game</strong>
            <small>มาเล่นเกมของเรากัน</small>
          </div>

          <span>→</span>

        </div>

      </a>

    </section>


    <footer class="menu-footer">
      <span>only for us</span>
      <span>♡</span>
    </footer>

  </main>

  <script src="menu.js"></script>

</body>
</html>
